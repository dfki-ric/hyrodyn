workflow:
  rules:
    - changes:
        - README.md
        - bin/**/* 
        - doc/**/* 
        - python/**/* 
        - robot/**/* 
      when: never
    - when: always

image: harbor.hb.dfki.de/hyrodyn/hyrodyn-ci:ubuntu22

stages:
  - build
  - test
  - deploy

variables:
  BUILD_DIR: build
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: -1
before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends
      build-essential
      cmake
      git
      libeigen3-dev
      libyaml-cpp-dev
      libboost-all-dev
      libtinyxml-dev
      libgtest-dev
      ca-certificates
  # Ubuntu provides gtest sources only — build them
  - cd /usr/src/gtest
  - cmake .
  - make -j
  - cp lib/*.a /usr/lib
  - cd -

build:
  stage: build
  script:
    - cmake -S . -B $BUILD_DIR -DBUILD_TESTING=ON
    - cmake --build $BUILD_DIR --parallel
  artifacts:
    paths:
      - $BUILD_DIR
    expire_in: 1 hour

test:
  stage: test
  script:
    # IMPORTANT: run tests from PROJECT ROOT
    - ./build/test/hyrodyn_tests

deploy:
  stage: deploy
  script:
    - cmake --install build --prefix install
  artifacts:
    paths:
      - install/
    expire_in: 7 days

